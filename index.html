<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SignalLab — Video Script</title>
<style>
:root{--ink:#1C212E;--mut:#6B7280;--amb:#2563eb;--line:#E7E3DA;--soft:#F0F4F8;--fs:19px}
*{box-sizing:border-box;-webkit-text-size-adjust:100%}
html{scroll-behavior:auto}
body{margin:0;background:#fff;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 80px}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 0 8px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:16px;margin:0;letter-spacing:-.01em;flex:1 1 auto}
h1 small{display:block;font-weight:400;font-size:12px;color:var(--mut);margin-top:2px}
.ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
button{font:inherit;font-size:14px;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 11px;cursor:pointer;line-height:1;transition:.15s ease}
button:hover{background:var(--soft)}
button:active{transform:scale(.97)}
#clock{font-variant-numeric:tabular-nums;min-width:58px;text-align:center;font-weight:600}
#clock.run{color:var(--amb);border-color:var(--amb)}
.scrollbar{display:flex;align-items:center;gap:7px;margin-top:9px;padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:#F8FAFC}
.scroll-title{font-size:12px;color:var(--mut);font-weight:600;margin-right:2px;white-space:nowrap}
#scrollToggle{font-weight:700;min-width:66px}
#scrollToggle.active{background:var(--amb);color:#fff;border-color:var(--amb)}
.speed{display:flex;align-items:center;gap:4px;margin-left:auto}
.speed button{padding:7px 8px;min-width:32px}
#speedValue{min-width:43px;text-align:center;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border-radius:999px;padding:9px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.chip.on{background:var(--amb);color:#fff;border-color:var(--amb)}
.sec{border-top:1px solid var(--line);padding:20px 0 8px;scroll-margin-top:130px}
.sec:first-of-type{border-top:0}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.who{color:var(--amb);font-weight:700}
.cam{border:1px solid var(--line);border-radius:5px;padding:1px 6px;letter-spacing:.03em}
h2{font-size:1.02em;margin:8px 0 12px;line-height:1.3}
.lines p{margin:0 0 .75em;font-size:var(--fs);line-height:1.62}
.formula{margin:14px 0;padding:12px 14px;background:var(--soft);border-left:3px solid var(--amb);border-radius:0 7px 7px 0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px;line-height:1.55;overflow-x:auto}
.cue{font-size:.78em;color:var(--mut);font-style:italic;line-height:1.5;border-left:2px solid var(--line);padding-left:11px;margin:14px 0 4px}
.sec.current{background:linear-gradient(90deg,rgba(37,99,235,.055),transparent)}
@media(max-width:600px){
.wrap{padding-left:14px;padding-right:14px}
.bar{gap:7px}
h1{width:100%;flex-basis:100%;margin-bottom:2px}
.ctl{width:100%}.ctl button{flex:1}
.scrollbar{flex-wrap:wrap}.scroll-title{width:100%}
.speed{margin-left:0;width:100%}.speed button{flex:1}
#speedValue{flex:0 0 52px}.sec{scroll-margin-top:185px}
}
@media print{header,.chips,.scrollbar{display:none}.sec{break-inside:avoid;border-top:0}}
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="bar">
<h1>SignalLab — Video Script<small>~20 sec · 1 speaker · Showcase Demo</small></h1>
<div class="ctl">
<button id="minus" aria-label="Smaller text">A−</button>
<button id="plus" aria-label="Bigger text">A+</button>
<button id="clock">0:00</button>
<button id="reset" aria-label="Reset timer">↻</button>
</div>
</div>
<div class="scrollbar">
<span class="scroll-title">AUTO SCROLL</span>
<button id="scrollToggle">▶ Start</button>
<button id="scrollReset">↕ Reset</button>
<div class="speed">
<button id="speedMinus">−</button>
<span id="speedValue">1.0×</span>
<button id="speedPlus">+</button>
</div>
</div>
<div class="chips" id="chips"></div>
</header>
<main id="out"></main>
</div>
<script>
const S=[
{n:1,sp:0,who:"Presenter",time:"0:00 – 0:04",dur:"4 s",w:11,cam:"Face camera",t:"The Hook",l:[
"Watch how fast we can analyze a signal without a backend."
],formula:[],c:"Face the camera directly. Speak confidently."},

{n:2,sp:0,who:"Presenter",time:"0:04 – 0:10",dur:"6 s",w:14,cam:"Screen record (Wi-Fi & Upload)",t:"The Offline Proof",l:[
"Wi-Fi is off.",
"I drop my raw WAV file directly into the browser..."
],formula:["Action 1: Turn off Wi-Fi","Action 2: Drag demo_sine_1kHz.wav","Action 3: Click 'Run Analysis'"],c:"Show cursor turning off Wi-Fi. Then show the 'Analyze' page, drag the file into the upload zone, and click the blue button."},

{n:3,sp:0,who:"Presenter",time:"0:10 – 0:15",dur:"5 s",w:14,cam:"Screen record (Results View)",t:"The Instant Rendering",l:[
"...and it instantly renders the time-domain waveform, the FFT spectrum, and the time-frequency spectrogram."
],formula:["Charts visible:","1. Time-Domain Waveform","2. Frequency Spectrum (FFT)","3. Spectrogram (Time-Frequency)"],c:"Fast zoom as the Results page instantly loads. Scroll quickly to show the three blue charts."},

{n:4,sp:0,who:"Presenter",time:"0:15 – 0:20",dur:"5 s",w:15,cam:"Screen record (Parameters & Export)",t:"The Extraction & Export",l:[
"It even extracts all your signal parameters—like our 999.8 Hertz dominant frequency—ready for export."
],formula:["Highlight: Dominant Frequency = 999.8 Hz","Action: Click 'Generate Report'"],c:"Scroll down to the 'Extracted Parameters' table, highlight the file details, then click the 'Generate Report' button at the top."}
];

const out=document.getElementById("out");
const chips=document.getElementById("chips");
const clock=document.getElementById("clock");
const scrollToggle=document.getElementById("scrollToggle");
const scrollReset=document.getElementById("scrollReset");
const speedMinus=document.getElementById("speedMinus");
const speedPlus=document.getElementById("speedPlus");
const speedValue=document.getElementById("speedValue");

let pick="all",fs=19,timer=0,timerTick=null,autoScroll=false,scrollSpeed=1;
let scrollAnimation=null,lastFrame=null;

try{
  const saved=JSON.parse(localStorage.getItem("signallabScript")||"{}");
  if(saved.fs)fs=saved.fs;
  if(saved.pick!==undefined)pick=saved.pick;
  if(saved.scrollSpeed)scrollSpeed=saved.scrollSpeed;
}catch(e){}

function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function draw(){
  out.innerHTML="";
  S.filter(s=>pick==="all"||s.sp===pick||pick==="spoken").forEach(s=>{
    const d=document.createElement("section");
    d.className="sec";
    let html = "";
    
    // Only show meta, titles, formulas, and cues if we are NOT in "Spoken Only" mode
    if (pick !== "spoken") {
      html += '<div class="meta"><span class="who">'+esc(s.who)+'</span><span>'+esc(s.time)+'</span><span>'+esc(s.dur)+'</span><span>'+esc(s.w)+' words</span><span class="cam">'+esc(s.cam)+'</span></div><h2>'+s.n+'. '+esc(s.t)+'</h2>';
    }
    
    html += '<div class="lines">';
    s.l.forEach(p=>html+="<p>"+esc(p)+"</p>");
    html += '</div>';
    
    if (pick !== "spoken") {
      if(s.formula&&s.formula.length){
        html+='<div class="formula">';
        s.formula.forEach(line=>html+=line===""?"<br>":esc(line)+"<br>");
        html+="</div>";
      }
      html+='<div class="cue"><b>Screen:</b> '+esc(s.c)+'</div>';
    }
    
    d.innerHTML=html;
    out.appendChild(d);
  });
}

function buildChips(){
  const list=[
    ["all","Full Script with Cues"],
    ["spoken","Spoken Words Only"]
  ];
  chips.innerHTML="";
  list.forEach(([value,label])=>{
    const b=document.createElement("button");
    b.className="chip"+(value===pick?" on":"");
    b.textContent=label;
    b.onclick=()=>{
      pick=value;
      save();
      buildChips();
      draw();
      window.scrollTo({top:0,behavior:"instant"});
    };
    chips.appendChild(b);
  });
}

function setFs(v){
  fs=Math.max(14,Math.min(34,v));
  document.documentElement.style.setProperty("--fs",fs+"px");
  save();
}

function fmt(n){
  return Math.floor(n/60)+":"+String(n%60).padStart(2,"0");
}

clock.onclick=()=>{
  if(timerTick){
    clearInterval(timerTick);
    timerTick=null;
    clock.classList.remove("run");
  }else{
    timerTick=setInterval(()=>{
      timer++;
      clock.textContent=fmt(timer);
    },1000);
    clock.classList.add("run");
  }
};

document.getElementById("reset").onclick=()=>{
  clearInterval(timerTick);
  timerTick=null;
  timer=0;
  clock.textContent="0:00";
  clock.classList.remove("run");
};

function autoScrollFrame(timestamp){
  if(!autoScroll){
    lastFrame=null;
    return;
  }
  if(lastFrame===null)lastFrame=timestamp;
  const delta=(timestamp-lastFrame)/1000;
  lastFrame=timestamp;

  const baseSpeed=18;
  window.scrollBy(0,baseSpeed*scrollSpeed*delta);

  const atBottom=window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-5;
  if(atBottom){
    stopAutoScroll();
    return;
  }
  scrollAnimation=requestAnimationFrame(autoScrollFrame);
}

function startAutoScroll(){
  if(autoScroll)return;
  autoScroll=true;
  scrollToggle.textContent="❚❚ Pause";
  scrollToggle.classList.add("active");
  lastFrame=null;
  scrollAnimation=requestAnimationFrame(autoScrollFrame);
}

function stopAutoScroll(){
  autoScroll=false;
  scrollToggle.textContent="▶ Start";
  scrollToggle.classList.remove("active");
  if(scrollAnimation)cancelAnimationFrame(scrollAnimation);
  scrollAnimation=null;
  lastFrame=null;
}

scrollToggle.onclick=()=>{
  if(autoScroll)stopAutoScroll();
  else startAutoScroll();
};

scrollReset.onclick=()=>{
  stopAutoScroll();
  window.scrollTo({top:0,behavior:"smooth"});
};

function setSpeed(value){
  scrollSpeed=Math.max(0.1,Math.min(10,value));
  speedValue.textContent=scrollSpeed.toFixed(1)+"×";
  save();
}

speedMinus.onclick=()=>{
  const step=scrollSpeed<=1?0.1:0.5;
  setSpeed(Math.round((scrollSpeed-step)*10)/10);
};

speedPlus.onclick=()=>{
  const step=scrollSpeed<1?0.1:0.5;
  setSpeed(Math.round((scrollSpeed+step)*10)/10);
};

document.addEventListener("keydown",e=>{
  if(e.code==="Space"&&document.activeElement.tagName!=="BUTTON"){
    e.preventDefault();
    autoScroll?stopAutoScroll():startAutoScroll();
  }
  if(e.key==="ArrowUp"){
    setSpeed(Math.round((scrollSpeed-0.1)*10)/10);
  }
  if(e.key==="ArrowDown"){
    setSpeed(Math.round((scrollSpeed+0.1)*10)/10);
  }
});

function save(){
  try{
    localStorage.setItem("signallabScript",JSON.stringify({fs,pick,scrollSpeed}));
  }catch(e){}
}

document.getElementById("minus").onclick=()=>setFs(fs-1);
document.getElementById("plus").onclick=()=>setFs(fs+1);

setFs(fs);
setSpeed(scrollSpeed);
buildChips();
draw();
</script>
</body>
</html>
